name: Gobernanza mensual

on:
  schedule:
    - cron: "0 6 1 * *"  # primer día de cada mes a las 06:00 UTC
  workflow_dispatch:       # permite ejecución manual

jobs:
  auditoria-automatica:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_DB: observatorio
          POSTGRES_USER: observatorio
          POSTGRES_PASSWORD: observatorio_ci
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://observatorio:observatorio_ci@localhost:5432/observatorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r requirements-dev.txt pip-audit
      - name: Dependencias Python
        run: pip-audit -r requirements.txt
      - name: Lint
        run: ruff check api/ etl/ tests/
      - name: Tests + cobertura
        run: pytest tests/ -q --cov=api --cov=etl --cov-fail-under=65
      - name: Migraciones sincronizadas
        run: |
          diff <(ls database/migrations/*.sql | xargs -n1 basename | sort) \
               <(grep -o '[0-9]\{4\}_[a-z0-9_]*\.sql' docker/docker-compose.yml | sort -u)
      - name: Schema + migraciones (integración real)
        run: |
          psql -U observatorio -h localhost -d observatorio -f database/schema.sql
          for f in database/migrations/*.sql; do
            psql -U observatorio -h localhost -d observatorio -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Abrir issue si algo falló
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "[gobernanza] Auditoría automática falló — " + new Date().toISOString().slice(0, 10),
              body: "La auditoría mensual automática falló. Revisar el workflow run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
              labels: ["bug", "gobernanza"]
            });
