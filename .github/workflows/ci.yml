name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_DB: observatorio
          POSTGRES_USER: observatorio
          POSTGRES_PASSWORD: observatorio_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://observatorio:observatorio_ci@localhost:5432/observatorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip install pip-audit
      - name: Lint (ruff)
        run: ruff check api/ etl/ tests/
      - name: Tests + coverage
        run: pytest tests/ -q --cov=api --cov=etl --cov-fail-under=65
      - name: Integration tests (PostgreSQL + migrations)
        # Sin `|| echo`: este paso terminaba en "integration tests skipped" sobre
        # un archivo que nunca se creó, así que el SQL de la API no se ejecutaba
        # en CI. Por eso llegó a producción un `SELECT nombre` ambiguo que daba
        # 500 en toda ficha de territorio. Si el archivo falta, debe fallar.
        run: |
          psql -U observatorio -h localhost -d observatorio -f database/schema.sql
          for f in database/migrations/*.sql; do
            psql -U observatorio -h localhost -d observatorio -v ON_ERROR_STOP=1 -f "$f"
          done
          PGUSER=observatorio PGPASSWORD=observatorio_ci PGHOST=localhost pytest tests/test_consulta_db.py -v
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Migraciones sincronizadas con docker-compose
        run: |
          migraciones_dir=$(ls database/migrations/*.sql | xargs -n1 basename | sort)
          migraciones_compose=$(grep -o '[0-9]\{4\}_[a-z0-9_]*\.sql' docker/docker-compose.yml | sort -u)
          diff <(echo "$migraciones_dir") <(echo "$migraciones_compose") || {
            echo "ERROR: las migraciones en database/migrations/ no coinciden con docker-compose.yml"
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm audit --production
