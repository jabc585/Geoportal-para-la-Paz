name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pip-audit
      - name: Lint
        run: |
          python -m compileall -q api/ etl/ tests/ || true
      - name: Tests
        run: pytest tests/ -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-* || true
      - name: Migraciones sincronizadas con docker-compose
        run: |
          migraciones_dir=$(ls database/migrations/*.sql | xargs -n1 basename | sort)
          migraciones_compose=$(grep -o '[0-9]\{4\}_[a-z_]*\.sql' docker/docker-compose.yml | sort -u)
          diff <(echo "$migraciones_dir") <(echo "$migraciones_compose") || {
            echo "ERROR: las migraciones en database/migrations/ no coinciden con docker-compose.yml"
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm run test --if-present
      - run: npm audit --production
