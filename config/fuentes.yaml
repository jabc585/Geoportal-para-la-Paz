# Catálogo estructurado de fuentes (plan2.md, Fase A punto 7).
# Solo fuentes NUEVAS (Fase B/C): no reemplaza los kwargs de upsert_fuente()
# que los 4 pipelines reales ya pasan a mano y están probados.
# Se usa para generar .env.example y las fichas docs/fuentes/<slug>.md nuevas.

fuentes:
  unhcr:
    nombre: "UNHCR"
    entidad: "Oficina del Alto Comisionado de las Naciones Unidas para los Refugiados"
    tipo: "internacional"
    url_base: "https://www.unhcr.org/"
    metodo_acceso: "api"
    periodicidad: "anual"
    formato: "JSON"
    licencia: "Verificar en ficha (sección 3, punto 5)"
    variable: "UNHCR_BASE_URL"
    ficha_doc: "docs/fuentes/unhcr.md"
    descripcion: "Población refugiada y desplazada de Colombia (sección 5.2)"
    estado: "implementado"

  cnmh:
    nombre: "CNMH"
    entidad: "Centro Nacional de Memoria Histórica"
    tipo: "nacional"
    url_base: "https://centrodememoriahistorica.gov.co/"
    metodo_acceso: "descarga"
    periodicidad: "anual"
    formato: "JSON"
    licencia: "Verificar en ficha (sección 3, punto 5)"
    variable: "CNMH_<HECHO>_URL"
    ficha_doc: "docs/fuentes/cnmh.md"
    descripcion: "Memoria histórica: minas, atentados, desaparición, reclutamiento, bienes civiles, acciones bélicas (SIEVCAC)"
    estado: "implementado"

  fiscalia:
    nombre: "Fiscalía"
    entidad: "Fiscalía General de la Nación"
    tipo: "nacional"
    url_base: "https://www.fiscalia.gov.co/"
    metodo_acceso: "api"
    periodicidad: "trimestral"
    formato: "JSON"
    licencia: "Verificar en ficha (sección 3, punto 5)"
    variable: "FISCALIA_PROCESOS_URL / FISCALIA_VICTIMAS_URL"
    ficha_doc: "docs/fuentes/fiscalia.md"
    descripcion: "Estadísticas judiciales: procesos y víctimas (datasets V3)"
    estado: "pendiente (agregación inviable por volumen; pipeline listo)"

  hdx:
    nombre: "HDX"
    entidad: "Humanitarian Data Exchange (OCHA)"
    tipo: "internacional"
    url_base: "https://data.humdata.org/"
    metodo_acceso: "api"
    periodicidad: "variable"
    formato: "JSON"
    licencia: "Verificar por dataset (sección 3, punto 5)"
    variable: "HDX_BASE_URL"
    ficha_doc: "docs/fuentes/hdx.md"
    descripcion: "Datos humanitarios de Colombia (541 datasets; HAPI dedicado: hdx-hapi-col)"
    estado: "implementado"

  policia:
    nombre: "Policía"
    entidad: "Policía Nacional de Colombia"
    tipo: "nacional"
    url_base: "https://www.policia.gov.co/"
    metodo_acceso: "api + descarga (Excel SIEDCO de homicidios)"
    periodicidad: "mensual"
    formato: "JSON, Excel"
    licencia: "Verificar en ficha (sección 3, punto 5)"
    variable: "POLICIA_<DELITO>_URL, POLICIA_HOMICIDIOS_URL"
    ficha_doc: "docs/fuentes/policia.md"
    descripcion: "Delitos por municipio: hurto, violencia intrafamiliar, delitos sexuales, homicidios (Excel SIEDCO 2025, 13.727 filas)"
    estado: "implementado"

  ucdp:
    nombre: "UCDP"
    entidad: "Uppsala Conflict Data Program"
    tipo: "internacional"
    url_base: "https://ucdp.uu.se/"
    metodo_acceso: "api"
    periodicidad: "anual"
    formato: "JSON"
    licencia: "Verificar en ficha (sección 3, punto 5)"
    variable: "UCDP_API_TOKEN"
    ficha_doc: "docs/fuentes/ucdp.md (pendiente de escribir)"
    descripcion: "Eventos de conflicto armado (GED)"
    estado: "pendiente (requiere registro; ficha no escrita)"

  acled:
    nombre: "ACLED"
    entidad: "Armed Conflict Location & Event Data"
    tipo: "internacional"
    url_base: "https://acleddata.com/"
    metodo_acceso: "descarga (archivos locales en data/external/)"
    periodicidad: "semanal"
    formato: "XLSX"
    licencia: "Uso con atribución (revisar antes de republicar, sección 3 punto 5)"
    variable: "ACLED_DATA_DIR"
    ficha_doc: "docs/fuentes/acled.md"
    descripcion: "Agregados país-año de eventos de conflicto y protesta (sin API key; export oficial descargado)"
    estado: "implementado"

  ideam:
    nombre: "IDEAM"
    entidad: "Instituto de Hidrología, Meteorología y Estudios Ambientales"
    tipo: "nacional"
    url_base: "https://www.ideam.gov.co/"
    metodo_acceso: "descarga"
    periodicidad: "anual"
    formato: "raster (Erdas Imagine .img, zip)"
    licencia: "Verificar en ficha (sección 3, punto 5)"
    variable: "IDEAM_BOSQUE_URL"
    ficha_doc: "docs/fuentes/ideam.md"
    descripcion: "Deforestación: cambio en superficie cubierta por bosque natural (raster 5 clases, por periodo)"
    estado: "implementado (requiere sembrar capa geo: python -m etl.common.capas_geo)"
