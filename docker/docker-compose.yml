services:
  postgres:
    image: postgis/postgis:17-3.4
    container_name: observatorio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: observatorio
      POSTGRES_USER: observatorio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observatorio_dev}
    ports:
      # Solo loopback (auditoría 2026-08-02): evita exponer Postgres en la LAN
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d NO se ejecuta recursivamente: cada SQL se
      # monta como archivo individual en orden de prefijo (sección 21, paso 2)
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/migrations/0001_raw_storage.sql:/docker-entrypoint-initdb.d/02_raw_storage.sql:ro
      - ../database/migrations/0002_quality_metrics.sql:/docker-entrypoint-initdb.d/03_quality_metrics.sql:ro
      - ../database/migrations/0003_geospatial_indexes.sql:/docker-entrypoint-initdb.d/04_geospatial_indexes.sql:ro
      - ../database/migrations/0004_seed_catalog.sql:/docker-entrypoint-initdb.d/05_seed_catalog.sql:ro
      - ../database/migrations/0005_pdet_proyectos.sql:/docker-entrypoint-initdb.d/06_pdet_proyectos.sql:ro
      - ../database/migrations/0006_fix_fuentes_codigo.sql:/docker-entrypoint-initdb.d/07_fix_fuentes_codigo.sql:ro
      - ../database/migrations/0007_seed_departamentos.sql:/docker-entrypoint-initdb.d/08_seed_departamentos.sql:ro
      - ../database/migrations/0008_pdet_anio_opcional.sql:/docker-entrypoint-initdb.d/09_pdet_anio_opcional.sql:ro
      - ../database/migrations/0009_fase_b_raw.sql:/docker-entrypoint-initdb.d/10_fase_b_raw.sql:ro
      - ../database/migrations/0010_geo_ideam.sql:/docker-entrypoint-initdb.d/11_geo_ideam.sql:ro
      - ../database/migrations/0011_policia_homicidios.sql:/docker-entrypoint-initdb.d/12_policia_homicidios.sql:ro
      - ../database/migrations/0012_pdet_dedup_hash.sql:/docker-entrypoint-initdb.d/13_pdet_dedup_hash.sql:ro
      - ../database/migrations/0013_privilegios_reales.sql:/docker-entrypoint-initdb.d/14_privilegios_reales.sql:ro
      - ../database/migrations/0014_rechazados_no_negativo.sql:/docker-entrypoint-initdb.d/15_rechazados_no_negativo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observatorio -d observatorio"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build:
      context: ..
      dockerfile: docker/Dockerfile.etl
    container_name: observatorio-etl
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Rol `etl` (migración 0013): escribe en raw/staging/curated
      DATABASE_URL: postgresql://etl:${ETL_PASSWORD:-etl_dev}@postgres:5432/observatorio
    volumes:
      - ../data:/app/data
    command: ["python", "-m", "etl.run_all"]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: observatorio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Rol `api` (migración 0013): solo SELECT en curated
      DATABASE_URL: postgresql://api:${API_PASSWORD:-api_dev}@postgres:5432/observatorio
    ports:
      # Solo loopback (auditoría 2026-08-02)
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  postgres_data:
